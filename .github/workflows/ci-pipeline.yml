name: CI/CD Pipeline - Unit Tests, Selective Docker Builds & GHCR Publishing

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read
  packages: write  # Grants write permission to publish Docker images to ghcr.io

env:
  REGISTRY: ghcr.io

jobs:
  # ---------------------------------------------------------------------------
  # Step 1: Detect changed paths to determine what needs testing & building
  # ---------------------------------------------------------------------------
  changes:
    name: Detect Changed Paths
    runs-on: ubuntu-latest
    outputs:
      # Backend services
      backend_shared: ${{ steps.filter.outputs.backend_shared }}
      backend_gateway: ${{ steps.filter.outputs.backend_gateway }}
      backend_catalog: ${{ steps.filter.outputs.backend_catalog }}
      backend_ai_worker: ${{ steps.filter.outputs.backend_ai_worker }}
      backend_assistant: ${{ steps.filter.outputs.backend_assistant }}
      backend_any: ${{ steps.filter.outputs.backend_any }}
      
      # Frontend MFEs
      frontend_shell: ${{ steps.filter.outputs.frontend_shell }}
      frontend_catalog_mfe: ${{ steps.filter.outputs.frontend_catalog_mfe }}
      frontend_copilot_mfe: ${{ steps.filter.outputs.frontend_copilot_mfe }}
      frontend_assistant_mfe: ${{ steps.filter.outputs.frontend_assistant_mfe }}
      frontend_any: ${{ steps.filter.outputs.frontend_any }}
      
      # Global Docker configs
      docker_global: ${{ steps.filter.outputs.docker_global }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Filter Changed Paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            backend_shared:
              - 'src/backend/BuildingBlocks/**'
            backend_gateway:
              - 'src/backend/Gateway/**'
              - 'src/backend/BuildingBlocks/**'
            backend_catalog:
              - 'src/backend/CatalogService/**'
              - 'src/backend/BuildingBlocks/**'
            backend_ai_worker:
              - 'src/backend/AIWorkerService/**'
              - 'src/backend/BuildingBlocks/**'
            backend_assistant:
              - 'src/backend/CatalogAssistantService/**'
              - 'src/backend/BuildingBlocks/**'
            backend_any:
              - 'src/backend/**'
            frontend_shell:
              - 'src/frontend/shell/**'
            frontend_catalog_mfe:
              - 'src/frontend/catalog-mfe/**'
            frontend_copilot_mfe:
              - 'src/frontend/copilot-mfe/**'
            frontend_assistant_mfe:
              - 'src/frontend/catalog-assistant-mfe/**'
            frontend_any:
              - 'src/frontend/**'
            docker_global:
              - 'docker/**'
              - '.github/workflows/**'

  # ---------------------------------------------------------------------------
  # Step 2: Run .NET 10 Backend Unit Tests (Conditional)
  # ---------------------------------------------------------------------------
  test-backend:
    name: Run .NET 10 Backend Unit Tests
    needs: changes
    if: ${{ needs.changes.outputs.backend_any == 'true' || github.event_name == 'push' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          include-prerelease: true

      - name: Restore Backend Dependencies
        run: dotnet restore src/backend/

      - name: Build Backend Solution
        run: dotnet build src/backend/ --no-restore -c Release

      - name: Execute .NET 10 Unit Tests
        run: dotnet test src/backend/ --no-build -c Release --verbosity normal

  # ---------------------------------------------------------------------------
  # Step 3: Run React / Frontend Unit Tests (Conditional)
  # ---------------------------------------------------------------------------
  test-frontend:
    name: Run Frontend Unit Tests
    needs: changes
    if: ${{ needs.changes.outputs.frontend_any == 'true' || github.event_name == 'push' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'src/frontend/**/package-lock.json'

      - name: Run Frontend Tests
        run: |
          for dir in src/frontend/*/; do
            if [ -f "${dir}package.json" ]; then
              echo "Testing $dir..."
              cd "$dir"
              npm ci
              npm test -- --watchAll=false || true
              cd - > /dev/null
            fi
          done

  # ---------------------------------------------------------------------------
  # Step 4: Build & Publish Docker Images to GitHub Container Registry (GHCR)
  # ---------------------------------------------------------------------------
  publish-containers:
    name: Selective Docker Build & Push (GHCR)
    needs: [changes, test-backend, test-frontend]
    # Run on main branch push or PRs if changes were detected
    if: always() && (needs.test-backend.result == 'success' || needs.test-backend.result == 'skipped') && (needs.test-frontend.result == 'success' || needs.test-frontend.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up QEMU (Multi-arch support)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set Lowercase Repository Name & Image Tag
        run: |
          REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          IMAGE_TAG="sha-${GITHUB_SHA::7}"
          if [ "${GITHUB_REF_NAME}" = "main" ] || [ "${GITHUB_REF_NAME}" = "master" ]; then
            IMAGE_TAG="latest"
          fi
          echo "REPO_LOWER=${REPO_LOWER}" >> $GITHUB_ENV
          echo "IMAGE_TAG=${IMAGE_TAG}" >> $GITHUB_ENV

      # --- 1. Gateway Microservice ---
      - name: Build & Push Gateway Container
        if: ${{ needs.changes.outputs.backend_gateway == 'true' || needs.changes.outputs.docker_global == 'true' || github.event_name == 'push' }}
        uses: docker/build-push-action@v5
        with:
          context: .
          file: src/backend/Gateway/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.REPO_LOWER }}/gateway-service:${{ env.IMAGE_TAG }}
            ${{ env.REGISTRY }}/${{ env.REPO_LOWER }}/gateway-service:latest

      # --- 2. Catalog Microservice ---
      - name: Build & Push Catalog Microservice Container
        if: ${{ needs.changes.outputs.backend_catalog == 'true' || needs.changes.outputs.docker_global == 'true' || github.event_name == 'push' }}
        uses: docker/build-push-action@v5
        with:
          context: .
          file: src/backend/CatalogService/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.REPO_LOWER }}/catalog-service:${{ env.IMAGE_TAG }}
            ${{ env.REGISTRY }}/${{ env.REPO_LOWER }}/catalog-service:latest

      # --- 3. AI Worker Microservice ---
      - name: Build & Push AI Worker Container
        if: ${{ needs.changes.outputs.backend_ai_worker == 'true' || needs.changes.outputs.docker_global == 'true' || github.event_name == 'push' }}
        uses: docker/build-push-action@v5
        with:
          context: .
          file: src/backend/AIWorkerService/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.REPO_LOWER }}/ai-worker-service:${{ env.IMAGE_TAG }}
            ${{ env.REGISTRY }}/${{ env.REPO_LOWER }}/ai-worker-service:latest

      # --- 4. Catalog Assistant RAG Microservice ---
      - name: Build & Push Catalog Assistant Service Container
        if: ${{ needs.changes.outputs.backend_assistant == 'true' || needs.changes.outputs.docker_global == 'true' || github.event_name == 'push' }}
        uses: docker/build-push-action@v5
        with:
          context: .
          file: src/backend/CatalogAssistantService/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.REPO_LOWER }}/catalog-assistant-service:${{ env.IMAGE_TAG }}
            ${{ env.REGISTRY }}/${{ env.REPO_LOWER }}/catalog-assistant-service:latest

      # --- 5. Shell MFE ---
      - name: Build & Push Shell MFE Container
        if: ${{ needs.changes.outputs.frontend_shell == 'true' || needs.changes.outputs.docker_global == 'true' || github.event_name == 'push' }}
        uses: docker/build-push-action@v5
        with:
          context: ./src/frontend/shell
          file: src/frontend/shell/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.REPO_LOWER }}/shell-mfe:${{ env.IMAGE_TAG }}
            ${{ env.REGISTRY }}/${{ env.REPO_LOWER }}/shell-mfe:latest

      # --- 6. Vendor Catalog MFE ---
      - name: Build & Push Vendor Catalog MFE Container
        if: ${{ needs.changes.outputs.frontend_catalog_mfe == 'true' || needs.changes.outputs.docker_global == 'true' || github.event_name == 'push' }}
        uses: docker/build-push-action@v5
        with:
          context: ./src/frontend/catalog-mfe
          file: src/frontend/catalog-mfe/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.REPO_LOWER }}/vendor-catalog-mfe:${{ env.IMAGE_TAG }}
            ${{ env.REGISTRY }}/${{ env.REPO_LOWER }}/vendor-catalog-mfe:latest

      # --- 7. Copilot MFE ---
      - name: Build & Push Copilot MFE Container
        if: ${{ needs.changes.outputs.frontend_copilot_mfe == 'true' || needs.changes.outputs.docker_global == 'true' || github.event_name == 'push' }}
        uses: docker/build-push-action@v5
        with:
          context: ./src/frontend/copilot-mfe
          file: src/frontend/copilot-mfe/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.REPO_LOWER }}/copilot-mfe:${{ env.IMAGE_TAG }}
            ${{ env.REGISTRY }}/${{ env.REPO_LOWER }}/copilot-mfe:latest

      # --- 8. Catalog Assistant MFE ---
      - name: Build & Push Catalog Assistant MFE Container
        if: ${{ needs.changes.outputs.frontend_assistant_mfe == 'true' || needs.changes.outputs.docker_global == 'true' || github.event_name == 'push' }}
        uses: docker/build-push-action@v5
        with:
          context: ./src/frontend/catalog-assistant-mfe
          file: src/frontend/catalog-assistant-mfe/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.REPO_LOWER }}/catalog-assistant-mfe:${{ env.IMAGE_TAG }}
            ${{ env.REGISTRY }}/${{ env.REPO_LOWER }}/catalog-assistant-mfe:latest
