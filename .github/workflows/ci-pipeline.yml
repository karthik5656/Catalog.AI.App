  # ---------------------------------------------------------------------------
  # Step 3: Build & Publish Docker Images to GitHub Container Registry (GHCR)
  # ---------------------------------------------------------------------------
  publish-containers:
    name: Selective Docker Build & Push (GHCR)
    needs: [changes]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up QEMU (Multi-arch support)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set Lowercase Repository Name & Image Tag
        run: |
          REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          IMAGE_TAG="sha-${GITHUB_SHA::7}"
          if [ "${GITHUB_REF_NAME}" = "main" ] || [ "${GITHUB_REF_NAME}" = "master" ]; then
            IMAGE_TAG="latest"
          fi
          echo "REPO_LOWER=${REPO_LOWER}" >> $GITHUB_ENV
          echo "IMAGE_TAG=${IMAGE_TAG}" >> $GITHUB_ENV

      # -----------------------------------------------------------------------
      # Backend Services
      # -----------------------------------------------------------------------

      # --- 1. Gateway Service ---
      - name: Build & Push Gateway Service
        id: build_gateway
        if: ${{ needs.changes.outputs.backend_gateway == 'true' || needs.changes.outputs.docker_global == 'true' }}
        uses: docker/build-push-action@v5
        with:
          context: .
          file: src/backend/Catalog.Gateway/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.REPO_LOWER }}/gateway-service:${{ env.IMAGE_TAG }}

      # --- 2. Catalog Service ---
      - name: Build & Push Catalog Service
        id: build_catalog
        if: ${{ needs.changes.outputs.backend_catalog == 'true' || needs.changes.outputs.docker_global == 'true' }}
        uses: docker/build-push-action@v5
        with:
          context: .
          file: src/backend/Catalog.App/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.REPO_LOWER }}/catalog-service:${{ env.IMAGE_TAG }}

      # --- 3. Chat Service ---
      - name: Build & Push Chat Service
        id: build_chat
        if: ${{ needs.changes.outputs.backend_chat == 'true' || needs.changes.outputs.docker_global == 'true' }}
        uses: docker/build-push-action@v5
        with:
          context: .
          file: src/backend/Catalog.Chat/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.REPO_LOWER }}/chat-service:${{ env.IMAGE_TAG }}

      # --- 4. RAG Service ---
      - name: Build & Push RAG Service
        id: build_rag
        if: ${{ needs.changes.outputs.backend_rag == 'true' || needs.changes.outputs.docker_global == 'true' }}
        uses: docker/build-push-action@v5
        with:
          context: .
          file: src/backend/Catalog.Rag/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.REPO_LOWER }}/rag-service:${{ env.IMAGE_TAG }}

      # -----------------------------------------------------------------------
      # Frontend Apps
      # -----------------------------------------------------------------------

      # --- 5. UI Catalog (Host Shell) ---
      - name: Build & Push UI Catalog
        id: build_ui_catalog
        if: ${{ needs.changes.outputs.frontend_catalog == 'true' || needs.changes.outputs.docker_global == 'true' }}
        uses: docker/build-push-action@v5
        with:
          context: ./src/frontend/apps/ui-catalog
          file: src/frontend/apps/ui-catalog/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.REPO_LOWER }}/ui-catalog:${{ env.IMAGE_TAG }}

      # --- 6. UI Catalog Consumer (Remote MFE) ---
      - name: Build & Push UI Catalog Consumer
        id: build_ui_consumer
        if: ${{ needs.changes.outputs.frontend_consumer == 'true' || needs.changes.outputs.docker_global == 'true' }}
        uses: docker/build-push-action@v5
        with:
          context: ./src/frontend/apps/ui-catalog-consumer
          file: src/frontend/apps/ui-catalog-consumer/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.REPO_LOWER }}/ui-catalog-consumer:${{ env.IMAGE_TAG }}

      # --- 7. UI Catalog Merchant (Remote MFE) ---
      - name: Build & Push UI Catalog Merchant
        id: build_ui_merchant
        if: ${{ needs.changes.outputs.frontend_merchant == 'true' || needs.changes.outputs.docker_global == 'true' }}
        uses: docker/build-push-action@v5
        with:
          context: ./src/frontend/apps/ui-catalog-merchant
          file: src/frontend/apps/ui-catalog-merchant/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.REPO_LOWER }}/ui-catalog-merchant:${{ env.IMAGE_TAG }}

      # -----------------------------------------------------------------------
      # Collect built images and prepare PR comment
      # -----------------------------------------------------------------------
      - name: Collect Built Image Tags
        id: collect
        run: |
          IMAGES=""

          if [ "${{ steps.build_gateway.outcome }}" = "success" ]; then
            IMAGES="${IMAGES}| **Gateway Service** | \`${{ env.REGISTRY }}/${{ env.REPO_LOWER }}/gateway-service:${{ env.IMAGE_TAG }}\` |"$'\n'
          fi
          if [ "${{ steps.build_catalog.outcome }}" = "success" ]; then
            IMAGES="${IMAGES}| **Catalog Service** | \`${{ env.REGISTRY }}/${{ env.REPO_LOWER }}/catalog-service:${{ env.IMAGE_TAG }}\` |"$'\n'
          fi
          if [ "${{ steps.build_chat.outcome }}" = "success" ]; then
            IMAGES="${IMAGES}| **Chat Service** | \`${{ env.REGISTRY }}/${{ env.REPO_LOWER }}/chat-service:${{ env.IMAGE_TAG }}\` |"$'\n'
          fi
          if [ "${{ steps.build_rag.outcome }}" = "success" ]; then
            IMAGES="${IMAGES}| **RAG Service** | \`${{ env.REGISTRY }}/${{ env.REPO_LOWER }}/rag-service:${{ env.IMAGE_TAG }}\` |"$'\n'
          fi
          if [ "${{ steps.build_ui_catalog.outcome }}" = "success" ]; then
            IMAGES="${IMAGES}| **UI Catalog** | \`${{ env.REGISTRY }}/${{ env.REPO_LOWER }}/ui-catalog:${{ env.IMAGE_TAG }}\` |"$'\n'
          fi
          if [ "${{ steps.build_ui_consumer.outcome }}" = "success" ]; then
            IMAGES="${IMAGES}| **UI Catalog Consumer** | \`${{ env.REGISTRY }}/${{ env.REPO_LOWER }}/ui-catalog-consumer:${{ env.IMAGE_TAG }}\` |"$'\n'
          fi
          if [ "${{ steps.build_ui_merchant.outcome }}" = "success" ]; then
            IMAGES="${IMAGES}| **UI Catalog Merchant** | \`${{ env.REGISTRY }}/${{ env.REPO_LOWER }}/ui-catalog-merchant:${{ env.IMAGE_TAG }}\` |"$'\n'
          fi

          if [ -z "$IMAGES" ]; then
            echo "has_images=false" >> $GITHUB_OUTPUT
          else
            echo "has_images=true" >> $GITHUB_OUTPUT
            {
              echo "images<<IMAGES_EOF"
              echo "$IMAGES"
              echo "IMAGES_EOF"
            } >> $GITHUB_OUTPUT
          fi

      # -----------------------------------------------------------------------
      # Delete old CI bot comments and post new one with latest images
      # -----------------------------------------------------------------------
      - name: Delete Previous CI Docker Image Comments
        if: ${{ steps.collect.outputs.has_images == 'true' }}
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const tag = '${{ env.COMMENT_TAG }}';
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });
            for (const comment of comments) {
              if (comment.body && comment.body.includes(tag)) {
                await github.rest.issues.deleteComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: comment.id,
                });
              }
            }

      - name: Post Docker Image Comment on PR
        if: ${{ steps.collect.outputs.has_images == 'true' }}
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const tag = `${{ env.COMMENT_TAG }}`;
            const images = `${{ steps.collect.outputs.images }}`;
            const sha = `${{ github.sha }}`;
            const shortSha = sha.substring(0, 7);

            const body = `${tag}
            ## 🐳 Docker Images Published

            > **Commit:** \`${shortSha}\` | **Registry:** \`${{ env.REGISTRY }}\`

            | Service | Image |
            |---------|-------|
            ${images.trim()}

            ---
            *Published by CI pipeline • ${new Date().toISOString()}*`;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: body,
            });
