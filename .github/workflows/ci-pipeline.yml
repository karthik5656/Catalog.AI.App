name: CI/CD Pipeline - PR Tests & Selective Docker Builds (GHCR)

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  packages: write  # Grants write permission to publish Docker images to ghcr.io

env:
  REGISTRY: ghcr.io

jobs:
  # ---------------------------------------------------------------------------
  # Step 1: Detect changed paths to determine what needs testing & building
  # ---------------------------------------------------------------------------
  changes:
    name: Detect Changed Paths
    runs-on: ubuntu-latest
    outputs:
      # Backend services
      backend_gateway: ${{ steps.filter.outputs.backend_gateway }}
      backend_catalog: ${{ steps.filter.outputs.backend_catalog }}
      backend_chat: ${{ steps.filter.outputs.backend_chat }}
      backend_rag: ${{ steps.filter.outputs.backend_rag }}
      backend_any: ${{ steps.filter.outputs.backend_any }}

      # Frontend apps
      frontend_catalog: ${{ steps.filter.outputs.frontend_catalog }}
      frontend_consumer: ${{ steps.filter.outputs.frontend_consumer }}
      frontend_merchant: ${{ steps.filter.outputs.frontend_merchant }}
      frontend_any: ${{ steps.filter.outputs.frontend_any }}

      # Global Docker configs
      docker_global: ${{ steps.filter.outputs.docker_global }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Filter Changed Paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            backend_gateway:
              - 'src/backend/Catalog.Gateway/**'
            backend_catalog:
              - 'src/backend/Catalog.App/**'
            backend_chat:
              - 'src/backend/Catalog.Chat/**'
            backend_rag:
              - 'src/backend/Catalog.Rag/**'
            backend_any:
              - 'src/backend/**'
            frontend_catalog:
              - 'src/frontend/apps/ui-catalog/**'
            frontend_consumer:
              - 'src/frontend/apps/ui-catalog-consumer/**'
            frontend_merchant:
              - 'src/frontend/apps/ui-catalog-merchant/**'
            frontend_any:
              - 'src/frontend/**'
            docker_global:
              - 'docker/**'
              - '.github/workflows/**'

  # ---------------------------------------------------------------------------
  # Step 2: Run .NET 10 Backend Tests (Conditional on backend changes)
  # ---------------------------------------------------------------------------
  test-backend:
    name: Build & Test .NET 10 Backend
    needs: changes
    if: ${{ needs.changes.outputs.backend_any == 'true' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - { name: 'Catalog.Gateway', path: 'src/backend/Catalog.Gateway' }
          - { name: 'Catalog.App',     path: 'src/backend/Catalog.App' }
          - { name: 'Catalog.Chat',    path: 'src/backend/Catalog.Chat' }
          - { name: 'Catalog.Rag',     path: 'src/backend/Catalog.Rag' }
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          include-prerelease: true

      - name: Restore ${{ matrix.service.name }}
        run: dotnet restore ${{ matrix.service.path }}

      - name: Build ${{ matrix.service.name }}
        run: dotnet build ${{ matrix.service.path }} --no-restore -c Release

      - name: Test ${{ matrix.service.name }}
        run: dotnet test ${{ matrix.service.path }} --no-build -c Release --verbosity normal

  # ---------------------------------------------------------------------------
  # Step 3: Lint & Build Frontend Apps (Conditional on frontend changes)
  # ---------------------------------------------------------------------------
  test-frontend:
    name: Lint & Build Frontend Apps
    needs: changes
    if: ${{ needs.changes.outputs.frontend_any == 'true' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app:
          - { name: 'ui-catalog',          path: 'src/frontend/apps/ui-catalog' }
          - { name: 'ui-catalog-consumer', path: 'src/frontend/apps/ui-catalog-consumer' }
          - { name: 'ui-catalog-merchant', path: 'src/frontend/apps/ui-catalog-merchant' }
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install pnpm
        run: corepack enable && corepack prepare pnpm@11.24.0 --activate

      - name: Install Dependencies (${{ matrix.app.name }})
        working-directory: ${{ matrix.app.path }}
        run: pnpm install --frozen-lockfile

      - name: Lint (${{ matrix.app.name }})
        working-directory: ${{ matrix.app.path }}
        run: pnpm run lint

      - name: Build (${{ matrix.app.name }})
        working-directory: ${{ matrix.app.path }}
        run: pnpm run build

  # ---------------------------------------------------------------------------
  # Step 4: Build & Publish Docker Images to GitHub Container Registry (GHCR)
  # ---------------------------------------------------------------------------
  publish-containers:
    name: Selective Docker Build & Push (GHCR)
    needs: [changes, test-backend, test-frontend]
    if: always() && (needs.test-backend.result == 'success' || needs.test-backend.result == 'skipped') && (needs.test-frontend.result == 'success' || needs.test-frontend.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up QEMU (Multi-arch support)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set Lowercase Repository Name & Image Tag
        run: |
          REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          IMAGE_TAG="sha-${GITHUB_SHA::7}"
          if [ "${GITHUB_REF_NAME}" = "main" ] || [ "${GITHUB_REF_NAME}" = "master" ]; then
            IMAGE_TAG="latest"
          fi
          echo "REPO_LOWER=${REPO_LOWER}" >> $GITHUB_ENV
          echo "IMAGE_TAG=${IMAGE_TAG}" >> $GITHUB_ENV

      # -----------------------------------------------------------------------
      # Backend Services
      # -----------------------------------------------------------------------

      # --- 1. Gateway Service ---
      - name: Build & Push Gateway Service
        if: ${{ needs.changes.outputs.backend_gateway == 'true' || needs.changes.outputs.docker_global == 'true' }}
        uses: docker/build-push-action@v5
        with:
          context: .
          file: src/backend/Catalog.Gateway/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.REPO_LOWER }}/gateway-service:${{ env.IMAGE_TAG }}

      # --- 2. Catalog Service ---
      - name: Build & Push Catalog Service
        if: ${{ needs.changes.outputs.backend_catalog == 'true' || needs.changes.outputs.docker_global == 'true' }}
        uses: docker/build-push-action@v5
        with:
          context: .
          file: src/backend/Catalog.App/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.REPO_LOWER }}/catalog-service:${{ env.IMAGE_TAG }}

      # --- 3. Chat Service ---
      - name: Build & Push Chat Service
        if: ${{ needs.changes.outputs.backend_chat == 'true' || needs.changes.outputs.docker_global == 'true' }}
        uses: docker/build-push-action@v5
        with:
          context: .
          file: src/backend/Catalog.Chat/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.REPO_LOWER }}/chat-service:${{ env.IMAGE_TAG }}

      # --- 4. RAG Service ---
      - name: Build & Push RAG Service
        if: ${{ needs.changes.outputs.backend_rag == 'true' || needs.changes.outputs.docker_global == 'true' }}
        uses: docker/build-push-action@v5
        with:
          context: .
          file: src/backend/Catalog.Rag/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.REPO_LOWER }}/rag-service:${{ env.IMAGE_TAG }}

      # -----------------------------------------------------------------------
      # Frontend Apps
      # -----------------------------------------------------------------------

      # --- 5. UI Catalog (Host Shell) ---
      - name: Build & Push UI Catalog
        if: ${{ needs.changes.outputs.frontend_catalog == 'true' || needs.changes.outputs.docker_global == 'true' }}
        uses: docker/build-push-action@v5
        with:
          context: ./src/frontend/apps/ui-catalog
          file: src/frontend/apps/ui-catalog/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.REPO_LOWER }}/ui-catalog:${{ env.IMAGE_TAG }}

      # --- 6. UI Catalog Consumer (Remote MFE) ---
      - name: Build & Push UI Catalog Consumer
        if: ${{ needs.changes.outputs.frontend_consumer == 'true' || needs.changes.outputs.docker_global == 'true' }}
        uses: docker/build-push-action@v5
        with:
          context: ./src/frontend/apps/ui-catalog-consumer
          file: src/frontend/apps/ui-catalog-consumer/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.REPO_LOWER }}/ui-catalog-consumer:${{ env.IMAGE_TAG }}

      # --- 7. UI Catalog Merchant (Remote MFE) ---
      - name: Build & Push UI Catalog Merchant
        if: ${{ needs.changes.outputs.frontend_merchant == 'true' || needs.changes.outputs.docker_global == 'true' }}
        uses: docker/build-push-action@v5
        with:
          context: ./src/frontend/apps/ui-catalog-merchant
          file: src/frontend/apps/ui-catalog-merchant/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.REPO_LOWER }}/ui-catalog-merchant:${{ env.IMAGE_TAG }}
